name: Publish discovery site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-discovery-site.mjs"
      - "docs/screenshots/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build search-friendly site
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .distribution/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexes:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run build:site
      - name: Notify IndexNow participants
        continue-on-error: true
        run: >-
          curl --fail-with-body --retry 2
          -H "Content-Type: application/json"
          --data @.distribution/indexnow.json
          https://api.indexnow.org/indexnow
