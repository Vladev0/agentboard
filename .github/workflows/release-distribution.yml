name: Publish autonomous distribution

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "scripts/build-mcpb-stage.mjs"
      - "scripts/write-server-json.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-distribution.yml"
  workflow_dispatch:
    inputs:
      republish_registry:
        description: "Republish an existing release to the MCP Registry"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: autonomous-distribution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Read version and release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report an existing version
        if: steps.release.outputs.exists == 'true' && inputs.republish_registry != true
        run: echo "v${{ steps.release.outputs.version }} is already distributed; bump package.json to create the next release."
      - name: Install dependencies
        if: steps.release.outputs.exists == 'false'
        run: |
          npm ci
          npm ci --prefix web
      - name: Test and build
        if: steps.release.outputs.exists == 'false'
        run: |
          npm test
          npm run build
          npm prune --omit=dev
      - name: Stage the MCP bundle
        if: steps.release.outputs.exists == 'false'
        run: |
          npm run build:mcpb-stage
          npm ci --omit=dev --ignore-scripts --prefix .distribution/mcpb
          npx -y @anthropic-ai/mcpb validate .distribution/mcpb/manifest.json
      - name: Pack bundle and registry metadata
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION=${{ steps.release.outputs.version }}
          (cd .distribution/mcpb && zip -qr "../agentboard-$VERSION.mcpb" .)
          node scripts/write-server-json.mjs ".distribution/agentboard-$VERSION.mcpb"
      - name: Create GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=${{ steps.release.outputs.version }}
          TAG="v$VERSION"
          gh release create "$TAG" ".distribution/agentboard-$VERSION.mcpb" ".distribution/server.json" --title "AgentBoard $VERSION" --generate-notes --target "$GITHUB_SHA"
      - name: Download existing registry metadata
        if: steps.release.outputs.exists == 'true' && inputs.republish_registry == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${{ steps.release.outputs.version }}" --pattern server.json --dir .distribution
      - name: Install MCP publisher
        if: steps.release.outputs.exists == 'false' || inputs.republish_registry == true
        shell: bash
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the official MCP Registry
        if: steps.release.outputs.exists == 'false' || inputs.republish_registry == true
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish .distribution/server.json
